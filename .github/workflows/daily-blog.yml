# コラムを毎日 1 本、自動で作る。
#
# 流れ：記事を生成（Claude API）→ 品質の検査 → ビルド → 通ったものだけ commit して main へ push → Vercel が自動で公開
# 検査やビルドに通らなかった日は、何も commit しない（サイトは変わらない）。
#
# 必要な設定（GitHub の Settings → Secrets and variables → Actions）
#   Secrets   ANTHROPIC_API_KEY ……… 必須。Claude API のキー
#             VERCEL_DEPLOY_HOOK_URL … 任意。push だけでは Vercel が動かないときの保険（Vercel の Deploy Hook の URL）
#   Variables ANTHROPIC_MODEL ………… 任意。使うモデル。無ければ Haiku（scripts/generate-daily-blog.mjs の DEFAULT_MODEL）
#             DAILY_BLOG_MODE ………… 任意。draft にすると、公開せず下書き（draft: true）として保存する
#             GIT_AUTHOR_NAME / GIT_AUTHOR_EMAIL … 任意。commit の作者。無ければ github-actions[bot]
#
# 止めたいとき：Actions → Daily column → 右上の「…」→ Disable workflow
name: Daily column

on:
  schedule:
    # 毎日 8:17（日本時間）。GitHub の cron は UTC なので前日の 23:17。
    # 毎時 0 分は GitHub が混み合い、0:00 UTC（9:00）に設定していたときは 3〜4 時間遅れて昼過ぎに動いていたため、ずらしている。
    # それでも遅れることはある。記事の日付は日本時間の実行日になる
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "テーマの id（data/blog-topics.json）。空なら自動で選ぶ"
        required: false
        default: ""
      dry_run:
        description: "お試し：生成と検査だけ行い、公開しない"
        type: boolean
        default: false
      force:
        description: "今日すでに自動の記事があっても、もう 1 本作る"
        type: boolean
        default: false

permissions:
  contents: write

# 同時に 2 つ走らせない（同じ日に 2 本できるのを防ぐ）。あとから来た実行は、前の実行が終わるまで待つ
concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 記事を生成する
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_REVIEW_MODEL: ${{ vars.ANTHROPIC_REVIEW_MODEL }}
          TOPIC: ${{ inputs.topic }}
        run: |
          args=()
          [ -n "$TOPIC" ] && args+=(--topic "$TOPIC")
          [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          [ "${{ vars.DAILY_BLOG_MODE }}" = "draft" ] && args+=(--draft)
          node scripts/generate-daily-blog.mjs "${args[@]}"

      # ここで失敗したら commit しない（壊れた記事を公開しない）
      # 型チェックはビルドのあとに行う（画像の型の定義 next-env.d.ts と .next/types は、ビルドで作られるため。
      # 先に型チェックすると、写真の import がすべてエラーになる。2026-10-28 にこれで公開が止まった）
      - name: 検査とビルド
        if: steps.generate.outputs.published == 'true'
        run: |
          npm run lint
          npm run build
          npm run typecheck

      - name: commit して push する
        if: steps.generate.outputs.published == 'true'
        env:
          AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
        run: |
          git config user.name "${AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git add content/column data/blog-topics.json data/site-facts.json
          if git diff --cached --quiet; then
            echo "変更がありません"
            exit 0
          fi
          git commit -m "content: add daily column $(TZ=Asia/Tokyo date +%F)"
          # 生成のあいだに main が進んでいた場合に備えて、取り込んでから push する
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Vercel に公開を依頼する（Deploy Hook を設定している場合だけ）
        if: steps.generate.outputs.published == 'true' && env.VERCEL_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" > /dev/null

      # 下書きと校閲の記録。公開されなかった日に、理由を確かめるために残す（14 日間）
      - name: 下書きと校閲の記録を保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-blog-${{ github.run_id }}
          path: .daily-blog/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
